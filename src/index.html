        body {

.wave-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0.7;
    clip-path: circle(0% at 0% 0%);
    box-shadow: inset 0 0 0 8px #1F1619;
  background: linear-gradient(
    290deg,
    hsl(35deg 82% 39%) 0%,
    hsl(25deg 79% 36%) 32%,
    hsl(15deg 76% 32%) 44%,
    hsl(3deg 73% 27%) 55%,
    hsl(354deg 66% 23%) 74%,
    hsl(346deg 57% 19%) 100%
  );
    z-index: 2;
    pointer-events: none;
    animation: waveFlow 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.wave-overlay::after {
    content: '';
    position: absolute;
    top: -5px; left: -5px; right: -5px; bottom: -5px;
    background: #1F1619;
    z-index: -1;
    clip-path: circle(0% at 0% 0%);
    animation: waveFlow 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes waveFlow {
    0% { clip-path: circle(0% at 0% 0%); }
    50% { clip-path: circle(100% at 5% 5%); }
    100% { clip-path: circle(0% at 50% 15%); }
}
        
        .red-hat-display {
    font-family: "Red Hat Display", sans-serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-style: normal;
}
.orbitron {
    font-optical-sizing: auto;
    font-weight: 800;
    font-style: normal;
}

        .card {

    hsl(350deg 65% 21%) 86%,

    hsl(2deg 68% 26%) 97%,
    hsl(3deg 66% 26%) 98%,
    hsl(4deg 65% 25%) 98%,

    hsl(6deg 61% 25%) 99%,
    hsl(7deg 59% 24%) 100%,
    hsl(7deg 57% 24%) 100%,
    hsl(8deg 55% 24%) 100%,
    hsl(8deg 53% 23%) 100%,
    hsl(9deg 51% 23%) 100%
  );
            z-index: 3;
            border: 5px solid #252121;
            border-radius: 26px;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: slideInFromTopLeft 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
        }
        
        @keyframes slideInFromTopLeft {
    0% {
        transform: translate(-100px, -100px) scale(0.8);
        opacity: 0;
    }
    100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
}

        .card.expanded { height: 320px; background: #17181C !important; }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.3s ease;
        }

        .card.expanded .main-content {
            display: none;
        }

.content-wrapper {
    color: #FBFBFC;
    padding: 15px;
    font-size: 17px;
    line-height: 1.15;
    display: none;
    height: calc(100% - 40px);
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.content-wrapper img {
    max-width: 100%;
    max-height: 290px;
    display: block;
    margin: 10px auto;
    border-radius: 8px;
}

.content-wrapper h1, .content-wrapper h2 {

    padding-bottom: 0.3em;
    margin-bottom: 16px;
    color: #fff;
}

.content-wrapper::-webkit-scrollbar {
    display: none;
}

.content-wrapper a {

    text-decoration: none;
    border-radius: 5px;
}
.content-wrapper a:hover {
    background: rgba(186, 218, 255, 0.15);
    color: #85BEFF;
}
.content-wrapper strong { color: #F8F8F9; font-weight: bold; }
.content-wrapper em { color: #ccc; font-style: italic; }


        .card.expanded .content-wrapper {
            display: block;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #282828;
            background-color: #434246;
            position: absolute;
            top: 16.4px;
            left: 16.4px;
            cursor: pointer;
            pointer-events: none;
        }
        
        .avatar-div {
            width: 64px;
            height: 64px;
            border-radius: 50%;

            background-color: #434246;

            top: 9px;
            left: 9px;

.avatar-div:hover {

}

        .tittle-pill {

            right: 15px;

            border-radius: 15px;

        }

}

        .icon-group {

.center-shape-wrapper {

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;

}

.center-shape {

.center-shape-wrapper:hover .center-shape {

<h1 class="Versal">Versal</h1>

<script>
    async function loadReadme(url, container) {
        let rawUrl = url
            .replace('github.com', 'raw.githubusercontent.com')
            .replace('/blob/', '/');

        try {
            const response = await fetch(rawUrl);
            if (!response.ok) throw new Error();
            const markdown = await response.text();
            container.innerHTML = marked.parse(markdown);
        } catch (error) {
            container.innerHTML = "<p style='padding: 20px; color: #888;'>Static problem... ♦️Repeat this or wait one minute.</p>";
        }
    }

    function toggleCard(event) {
        event.stopPropagation();
        const clickedCard = event.currentTarget.closest('.card');
        const contentWrapper = clickedCard.querySelector('.content-wrapper');
        
        if (!contentWrapper) return;
        const isExpanding = !clickedCard.classList.contains('expanded');
        document.querySelectorAll('.card').forEach(c => c.classList.remove('expanded'));
        clickedCard.classList.toggle('expanded');
        if (isExpanding && contentWrapper.innerHTML.trim() === "") {
            const url = contentWrapper.getAttribute('data-url');
            if (url) loadReadme(url, contentWrapper);
        }
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.card')) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('expanded'));
        }
    });
</script>
